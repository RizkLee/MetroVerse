name: Build pull request

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "fastlane/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create CI debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Compile FOSS debug
        run: ./gradlew --console=plain :app:compileFossDebugKotlin

      - name: Build FOSS debug APK
        run: ./gradlew --console=plain :app:assembleFossDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: MetroVerse-pr-${{ github.event.number }}
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
