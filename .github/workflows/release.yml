name: Build signed MetroVerse release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and sign ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        include:
          - variant: foss
            task: assembleFossRelease
            artifact: MetroVerse
          - variant: gms
            task: assembleGmsRelease
            artifact: MetroVerse-with-Google-Cast
          - variant: izzy
            task: assembleIzzyRelease
            artifact: MetroVerse-izzy

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build unsigned APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:${{ matrix.task }}
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 37.0.0

      - name: Collect signed APK
        shell: bash
        run: |
          mkdir -p release-files
          SIGNED_APK=$(find "app/build/outputs/apk/${{ matrix.variant }}/release" -name "*-signed.apk" -o -name "*-unsigned-signed.apk" | head -1)
          if [ -z "$SIGNED_APK" ]; then
            echo "No signed APK was produced"
            exit 1
          fi
          cp "$SIGNED_APK" "release-files/${{ matrix.artifact }}.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: release-files/*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-files
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: MetroVerse ${{ inputs.tag }}
          body: |
            MetroVerse is a personal learning project. Review the repository and release notes before installing.
          files: release-files/*.apk
