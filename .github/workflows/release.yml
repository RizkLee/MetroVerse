name: Build signed MetroVerse release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.5.2"
        required: true
        type: string
      publish:
        description: "Publish or replace the GitHub Release"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build and sign ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        include:
          - variant: foss
            task: assembleFossRelease
            artifact: MetroVerse
          - variant: gms
            task: assembleGmsRelease
            artifact: MetroVerse-with-Google-Cast

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Build unsigned APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:${{ matrix.task }}
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign APK
        uses: ilharp/sign-android-release@13dd52242698526f951aa8bb8696204f6fea702a # v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 37.0.0

      - name: Collect signed APK
        shell: bash
        run: |
          mkdir -p release-files
          SIGNED_APK=$(find "app/build/outputs/apk/${{ matrix.variant }}/release" -name "*-signed.apk" -o -name "*-unsigned-signed.apk" | head -1)
          if [ -z "$SIGNED_APK" ]; then
            echo "No signed APK was produced"
            exit 1
          fi
          cp "$SIGNED_APK" "release-files/MetroVerse-${{ inputs.tag }}-${{ matrix.variant }}.apk"

      - name: Verify release certificate
        shell: bash
        env:
          RELEASE_APK: release-files/MetroVerse-${{ inputs.tag }}-${{ matrix.variant }}.apk
          EXPECTED_CERT_SHA256: E2450731E5E35B3CCD61A9FE1A12B86CA7FB3E11073CA27F3E5FF6EB6CDD7250
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          VERIFICATION="$($APKSIGNER verify --verbose --print-certs "$RELEASE_APK")"
          printf '%s\n' "$VERIFICATION"
          ACTUAL_CERT="$(printf '%s\n' "$VERIFICATION" | sed -n -E 's/^(Signer #1|V[0-9.]+ Signer): certificate SHA-256 digest: //p' | head -n 1 | tr -d ':')"
          test "${ACTUAL_CERT^^}" = "$EXPECTED_CERT_SHA256"

      - name: Upload signed APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: release-files/*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-files
          merge-multiple: true

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          cd release-files
          sha256sum *.apk > "MetroVerse-${{ inputs.tag }}-SHA256SUMS.txt"

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          name: MetroVerse ${{ inputs.tag }}
          body: |
            MetroVerse unifies YouTube Music and open RSS podcasts in one Android app.

            ## Downloads

            | Variant | Description | Download link |
            | --- | --- | --- |
            | FOSS APK | MetroVerse app without Google Cast support | [Download](https://github.com/RizkLee/MetroVerse/releases/download/${{ inputs.tag }}/MetroVerse-${{ inputs.tag }}-foss.apk) |
            | GMS APK | The same app, but with Google Cast support | [Download](https://github.com/RizkLee/MetroVerse/releases/download/${{ inputs.tag }}/MetroVerse-${{ inputs.tag }}-gms.apk) |

            ## Verification

            Review the attached checksum file and APK signing certificate before installation.

            ---

            MetroVerse 将 YouTube Music 与开放 RSS 播客整合在同一个 Android 应用中。

            ## 下载

            | App 版本 | 适用场景 | 下载链接 |
            | --- | --- | --- |
            | FOSS APK | 音乐与播客，不包含 Google Cast 功能 | [下载 MetroVerse](https://github.com/RizkLee/MetroVerse/releases/download/${{ inputs.tag }}/MetroVerse-${{ inputs.tag }}-foss.apk) |
            | GMS APK | 音乐与播客，包含 Google Cast 功能 | [下载 MetroVerse](https://github.com/RizkLee/MetroVerse/releases/download/${{ inputs.tag }}/MetroVerse-${{ inputs.tag }}-gms.apk) |

            ## 文件校验

            安装前请核对附件中的校验和文件与 APK 签名证书。
          prerelease: ${{ inputs.prerelease }}
          files: release-files/*
