name: Manual test build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build FOSS debug APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:assembleFossDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: MetroVerse-manual-test
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
