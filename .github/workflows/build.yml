name: Build MetroVerse

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "fastlane/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foss-debug:
    name: FOSS debug build and podcast tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create CI debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Compile and run podcast tests
        run: >-
          ./gradlew --console=plain
          :app:compileFossDebugKotlin
          :app:testFossDebugUnitTest
          --tests com.metrolist.music.podcast.PodcastParsingTest
          --tests com.metrolist.music.podcast.PodcastCategoriesTest
          --tests com.metrolist.music.playback.SleepTimerTest
          --tests com.metrolist.music.listentogether.ListenTogetherServersTest
          --tests com.metrolist.music.utils.UpdaterTest
          --tests com.metrolist.music.extensions.PlaylistDeduplicationTest
          --tests com.metrolist.music.ui.utils.YouTubeUtilsTest

      - name: Build debug APK
        run: ./gradlew --console=plain :app:assembleFossDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: MetroVerse-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
